# ALGBr shared backend on Cloudflare Workers: /api/* for every store + the
# /admin/ dashboard (static assets from dist/), hourly CJ sync (cron).
# Kept in cloudflare/ so the storefront Pages builds (repo root) ignore it.
# Build + deploy: npm run deploy:api.
# Secrets (ADMIN_PASSWORD, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CJ_API_KEY,
# optional CJ_AUTO_PAY, NTFY_TOPIC) are set in the Cloudflare dashboard, never here.
name = "api-algbr"
main = "worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "algbr-crm"
database_id = "3ab63107-8a8e-40e2-988d-33edb35f2da5"

# OFF. by ALGBr: product photos uploaded from the OFF admin.
[[kv_namespaces]]
binding = "OFF_MEDIA"
id = "65b2fd1b06c94a7498c10ba4f77f0eda"

[vars]
# Preview addresses of the Worker-served storefronts, allowed to call the API (CORS).
EXTRA_ORIGINS = "https://glow-algbr.guybeaho.workers.dev,https://kin-algbr.guybeaho.workers.dev,https://off-algbr.guybeaho.workers.dev"
