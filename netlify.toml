# Nomad platform — host site: the NOMAD storefront + the shared API (functions)
# and the admin dashboard for every store. Other stores are separate Netlify
# sites with their own netlify.toml in sites/<store>/ (static, no functions).
# Security headers and the pre-launch noindex are generated per store in dist/_headers.
[build]
  command = "node scripts/build.mjs nomad"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
