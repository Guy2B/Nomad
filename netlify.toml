# ALGBr shared backend (Netlify): /api/* for every store (checkout, Stripe webhook,
# tracking, admin, hourly CJ sync) + the /admin/ dashboard, on api.algbr.eu.
# The storefronts (GO, SPACE, EASE) are static sites on Cloudflare Pages.
[build]
  command = "node scripts/build.mjs backend"
  publish = "dist"
  # Netlify bills credits per production deploy: rebuild only when the API, the
  # admin or a catalogue (prices, products) changed. Exit 0 = skip this build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ public/admin/ public/assets/style.css package.json 'stores/*/products.json' 'stores/*/site.json' stores/platform.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
