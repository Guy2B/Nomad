# KIN storefront: static pages built by scripts/build.mjs (kin), served by Cloudflare (assets only).
# Deploy: npm run deploy:kin. Custom domain kin.algbr.eu is attached in the Cloudflare dashboard.
name = "kin-algbr"
compatibility_date = "2026-09-01"

[assets]
directory = "../../dist"
html_handling = "auto-trailing-slash"
