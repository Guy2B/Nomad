<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Algebra · Operating Cockpit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="cockpit.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login__box" id="login-form">
    <img src="a.svg" alt="" class="login__a" width="56" height="56">
    <p class="login__title">Operating Cockpit</p>
    <p class="muted">Algebra · internal. Data loads only with the admin token.</p>
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required>
    <button type="submit">Enter</button>
    <p class="login__err" id="login-err" hidden role="alert">Token refused.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side__brand" href="#/dashboard"><img src="a.svg" alt="" width="32" height="32"><span><b>Algebra</b><small>Operating Cockpit</small></span></a>
    <nav class="side__nav" aria-label="Cockpit">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/orders" data-view="orders">Orders</a>
      <a href="#/alerts" data-view="alerts">Alerts <span class="badge" id="alert-count" hidden></span></a>
      <a href="#/fulfillment" data-view="fulfillment">Fulfillment</a>
      <a href="#/finance" data-view="finance">Finance</a>
      <a href="#/products" data-view="products">Products</a>
      <a href="#/graphic-series" data-view="graphic-series">Graphic Series</a>
      <a href="#/inventory" data-view="inventory">Inventory</a>
      <a href="#/customers" data-view="customers">Customers</a>
      <a href="#/circle" data-view="circle">A Circle</a>
      <a href="#/analytics" data-view="analytics">Analytics</a>
      <a href="#/settings" data-view="settings">Settings</a>
    </nav>
    <div class="side__foot"><span id="mode-pill" class="pill"></span><button type="button" id="logout" class="linkish">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button type="button" class="menu" id="menu" aria-controls="side" aria-expanded="false">Menu</button>
      <h1 id="view-title">Dashboard</h1>
      <div class="top__tools" id="range-tools">
        <label for="range" class="sr">Period</label>
        <select id="range">
          <option value="today">Today</option>
          <option value="7d">7 days</option>
          <option value="30d" selected>30 days</option>
          <option value="90d">90 days</option>
          <option value="year">Year</option>
          <option value="custom">Custom</option>
        </select>
        <span id="custom" hidden><input type="date" id="from" aria-label="From"> <input type="date" id="to" aria-label="To"></span>
        <button type="button" id="refresh" class="ghost">Refresh</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<script src="cockpit.js" type="module"></script>
</body>
</html>
