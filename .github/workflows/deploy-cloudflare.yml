# Publishes the Cloudflare Workers on every push to main, only what changed:
#   api.algbr.eu (backend + dashboard) · GLOW · KIN · OFF.
# GO, SPACE and EASE are Cloudflare Pages projects: Cloudflare rebuilds them itself.
#
# The API embeds every shop's catalogue (prices are checked at checkout), so a change
# in any shops/*/products.json or site.json republishes the API too.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens,
# template "Edit Cloudflare Workers"). Actions → this workflow → "Run workflow" publishes all four.
name: Deploy Cloudflare (API, GLOW, KIN, OFF)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      glow: ${{ steps.f.outputs.glow }}
      kin: ${{ steps.f.outputs.kin }}
      off: ${{ steps.f.outputs.off }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            api:
              - 'engine/**'
              - 'backend/**'
              - 'public/admin/**'
              - 'shared/**'
              - 'shops/*/products.json'
              - 'shops/*/site.json'
              - 'scripts/build.mjs'
              - 'package*.json'
            glow:
              - 'shops/glow/**'
              - 'public/**'
              - 'shared/platform.json'
              - 'scripts/**'
            kin:
              - 'shops/kin/**'
              - 'public/**'
              - 'shared/platform.json'
              - 'scripts/**'
            off:
              - 'shops/off/**'
              - 'shared/platform.json'
              - 'scripts/deploy-off.mjs'

  deploy:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' || needs.changes.outputs.glow == 'true' ||
      needs.changes.outputs.kin == 'true' || needs.changes.outputs.off == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c7b9d85bb7d0ec8a475ad015364fa460
      npm_config_yes: 'true'
      ALL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (nothing is published if they fail)
        run: npm test
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: API + dashboard (api.algbr.eu)
        if: env.ALL == 'true' || needs.changes.outputs.api == 'true'
        run: npm run deploy:api
      - name: GLOW (glow.algbr.eu)
        if: env.ALL == 'true' || needs.changes.outputs.glow == 'true'
        run: npm run deploy:glow
      - name: KIN (kin.algbr.eu)
        if: env.ALL == 'true' || needs.changes.outputs.kin == 'true'
        run: npm run deploy:kin
      - name: OFF. (off.algbr.eu)
        if: env.ALL == 'true' || needs.changes.outputs.off == 'true'
        run: npm run deploy:off
